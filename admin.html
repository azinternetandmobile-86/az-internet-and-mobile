<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Dashboard | AZ INTERNET AND MOBILE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
  <header>
    <div class="wrap nav">
      <a class="brand" href="index.html">
        <img src="az-logo.png" alt="AZ logo">
        <span>AZ INTERNET AND MOBILE<small>ADMIN DASHBOARD</small></span>
      </a>
      <nav>
        <a href="index.html" class="back-link">← वेबसाइट पर जाएँ</a>
      </nav>
    </div>
  </header>

  <section class="admin-hero">
    <div class="wrap">
      <span class="tag">BUSINESS CONTROL CENTER</span>
      <h1>Admin Dashboard</h1>
      <p>प्रोडक्ट, बुकिंग और ग्राहक रिक्वेस्ट मैनेज करें।</p>
    </div>
  </section>

  <section class="admin-main">
    <div class="wrap" id="admin-root">
      <div class="panel" id="admin-panel">
        <div class="panel-header">
          <h2>Admin Access</h2>
          <span class="status-badge">Secure Panel</span>
        </div>
        <div id="auth-area"></div>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">AZ INTERNET AND MOBILE · Kala Balua, Araria · Admin Panel</div>
  </footer>

  <script>
    window.addEventListener("error", function (e) {
      var el = document.getElementById("auth-area");
      if (el) {
        el.innerHTML = '<p class="error-msg">Error: ' + (e.message || "JS Error") + "</p>";
      }
    });
  </script>
  <script src="admin.js"></script>
</body>
</html>
